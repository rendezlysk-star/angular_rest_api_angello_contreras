<section class="list-page-container">
  <header class="page-header ds-header">
    <h2>Demon Slayer</h2>
  </header>

  @if (isLoading()) {
    <div class="spinner-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else {
    <div class="characters-grid">
      @for (char of characters(); track char.id) {
        <app-character-card
          [character]="char"
          [detailRoutePrefix]="'/demon-slayer'"
          themeClass="universe-demon-slayer"
        >
        </app-character-card>
      }
    </div>

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[10, 20, 50]"
      [pageIndex]="pageIndex()"
      (page)="onPageChange($event)"
      aria-label="Seleccionar página de Demon Slayer"
    >
    </mat-paginator>
  }
</section>
