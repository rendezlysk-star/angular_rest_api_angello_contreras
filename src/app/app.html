<mat-toolbar color="primary" class="main-header">
  <span class="header-title" routerLink="/">Multiverse Explorer</span>
  <span class="spacer"></span>
  <nav class="nav-menu">
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      >Inicio</a
    >
    <a mat-button routerLink="/digimon" routerLinkActive="active-link">Digimon</a>
    <a mat-button routerLink="/dbz" routerLinkActive="active-link">Dragon Ball Z</a>
    <a mat-button routerLink="/pokemon" routerLinkActive="active-link">Pokémon</a>
    <a mat-button routerLink="/demon-slayer" routerLinkActive="active-link">Demon Slayer</a>
  </nav>
  <button mat-icon-button (click)="themeService.toggleTheme()" aria-label="Cambiar tema">
    <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<div class="content-container">
  <router-outlet></router-outlet>
</div>
