<mat-card class="character-card {{ themeClass }}" (click)="navigateToDetail()" matRipple>
  <div
    class="card-image-box"
    (click)="openImageModal($event)"
    title="Haz clic para ampliar la imagen"
  >
    <img [src]="character.image" [alt]="character.name" loading="lazy" />
    <span class="zoom-badge">Ampliar</span>
  </div>
  <mat-card-content class="card-info">
    <span class="char-id">#{{ character.id }}</span>
    <h3 class="char-name">{{ character.name }}</h3>
  </mat-card-content>
</mat-card>
